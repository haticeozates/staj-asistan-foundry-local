[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "staj-asistan"
version = "2.0.0"
description = "StajAsistan 2.0 - a privacy-aware, citation-grounded local RAG assistant for the Microsoft AI Innovators Summer Internship, built on Microsoft Foundry Local."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hatice Ozates" }]
keywords = ["rag", "foundry-local", "local-llm", "privacy", "streamlit"]

dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
# Streamlit UI
ui = ["streamlit>=1.36"]
# Local embedding fallback when Foundry Local exposes no embedding model
embeddings = ["sentence-transformers>=3.0"]
# Optional persistent vector store backend
chroma = ["chromadb>=0.5"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
all = [
    "streamlit>=1.36",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
staj-asistan = "staj_asistan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
